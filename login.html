<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>justryuz :: ssh login</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="wrap">
    <nav class="topnav" aria-label="Menu utama">
      <ul id="nav-links"></ul>
      <span class="db">ssh :: <b>git.justryuz.my</b></span>
    </nav>

    <main class="term" id="term" aria-label="Terminal SSH">
      <div class="term-bar">
        <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
        <span class="term-title">visitor@local: ~</span>
      </div>
      <div class="screen" id="screen" aria-live="polite">
        <div id="out"></div>
        <div class="line">
          <span id="prompt" class="prompt"></span>
          <input id="input" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Terminal input">
        </div>
      </div>
    </main>

    <footer class="foot">
      <a href="index.html">&larr; kembali ke blog</a>
    </footer>
  </div>

  <script src="data.js"></script>
  <script src="nav.js"></script>
  <script src="config.js"></script>
  <script src="terminal.js"></script>
</body>
</html>

<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>justryuz :: admin</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="wrap">
    <nav class="topnav" aria-label="Menu admin">
      <ul>
        <li><a href="index.html">home</a></li>
        <li><a href="login.html">ssh</a></li>
      </ul>
      <span class="db" id="who">belum login</span>
    </nav>

    <!-- Login -->
    <section id="login-box" class="box panel" hidden>
      <h2>admin login</h2>
      <form id="login-form" autocomplete="off">
        <label>User <input id="l-user" type="text" required></label>
        <label>Password <input id="l-pass" type="password" required autocomplete="current-password"></label>
        <button type="submit" class="btn">Login</button>
      </form>
      <p class="msg" id="login-msg" role="alert"></p>
    </section>

    <!-- Dashboard -->
    <section id="dash" hidden>
      <div class="bar-row">
        <button class="btn" id="new-btn" type="button">+ Post baru</button>
        <button class="btn alt" id="import-btn" type="button" hidden>Import post dari data.js</button>
        <button class="btn alt" id="logout-btn" type="button">Logout</button>
        <span class="msg" id="dash-msg" role="status"></span>
      </div>

      <div class="tabs" role="tablist">
        <button type="button" class="tab on" data-tab="posts">Posts</button>
        <button type="button" class="tab" data-tab="users" id="tab-users" hidden>Users</button>
        <button type="button" class="tab" data-tab="account">Akaun saya</button>
      </div>

      <!-- Tab: posts -->
      <div id="pane-posts">
      <div class="sec-title" id="posts-title">Semua post</div>
      <table id="list" class="list"></table>

      <!-- Editor -->
      <div id="editor" class="box panel" hidden>
        <h2 id="ed-title">Post baru</h2>
        <form id="ed-form" autocomplete="off">
          <div class="grid">
            <label>Title <input id="f-title" required maxlength="150"></label>
            <label>Slug <input id="f-slug" required maxlength="80" pattern="[a-z0-9]+(-[a-z0-9]+)*" title="huruf kecil, angka, tanda -"></label>
            <label>Tarikh <input id="f-date" type="date" required></label>
            <label>Kumpulan
              <select id="f-group">
                <option value="blog">latest posts</option>
                <option value="writeups">ctf writeups</option>
                <option value="notes">quick notes</option>
              </select>
            </label>
            <label>Kategori (type) <input id="f-type" maxlength="40" placeholder="linux, web, crypto..."></label>
            <label>Platform <input id="f-platform" maxlength="40" placeholder="ubuntu, php..."></label>
            <label>Level (1-5) <input id="f-level" type="number" min="1" max="5" value="1" required></label>
            <label>Tested on <input id="f-tested" maxlength="100" placeholder="Linux, Windows"></label>
          </div>
          <label>Ringkasan <input id="f-summary" maxlength="300"></label>
          <label>Tags (asing dengan koma) <input id="f-tags" placeholder="ssh, fail2ban, vps"></label>
          <label>Rujukan (pilihan) <input id="f-ref" maxlength="200"></label>
          <label>Kandungan
            <textarea id="f-body" rows="16" spellcheck="false"></textarea>
          </label>
          <p class="hint">
            Perenggan dipisah baris kosong. Baris bermula <code># </code> jadi tajuk kecil.
            Kod di antara baris <code>```</code> dan <code>```</code>. Teks biasa sahaja (tiada HTML).
          </p>
          <div class="bar-row">
            <button class="btn" type="submit" id="save-btn">Simpan</button>
            <button class="btn alt" type="button" id="cancel-btn">Batal</button>
            <span class="msg" id="ed-msg" role="alert"></span>
          </div>
        </form>
      </div>
      </div><!-- /pane-posts -->

      <!-- Tab: users (admin only) -->
      <div id="pane-users" hidden>
        <div class="sec-title">Senarai user</div>
        <table id="ulist" class="list"></table>
        <div class="box panel">
          <h2>Tambah user</h2>
          <form id="u-form" autocomplete="off">
            <div class="grid">
              <label>Username <input id="u-name" required maxlength="20" pattern="[a-z0-9_]{3,20}" title="3-20 huruf kecil, angka, _"></label>
              <label>Role
                <select id="u-role"><option value="editor">editor (post sendiri)</option><option value="admin">admin (semua)</option></select>
              </label>
              <label>Password (min 10) <input id="u-pass" type="password" required minlength="10" maxlength="128" autocomplete="new-password"></label>
            </div>
            <div class="bar-row">
              <button class="btn" type="submit">Cipta user</button>
              <span class="msg" id="u-msg" role="alert"></span>
            </div>
          </form>
        </div>
      </div>

      <!-- Tab: my account -->
      <div id="pane-account" hidden>
        <div class="box panel">
          <h2>Akaun saya</h2>
          <p class="hint" id="acc-info"></p>
          <form id="pw-form" autocomplete="off">
            <label>Password semasa <input id="pw-cur" type="password" required autocomplete="current-password"></label>
            <label>Password baru (min 10) <input id="pw-new" type="password" required minlength="10" maxlength="128" autocomplete="new-password"></label>
            <label>Ulang password baru <input id="pw-new2" type="password" required minlength="10" maxlength="128" autocomplete="new-password"></label>
            <div class="bar-row">
              <button class="btn" type="submit" id="pw-btn">Tukar password</button>
              <span class="msg" id="pw-msg" role="alert"></span>
            </div>
          </form>
        </div>
      </div>
    </section>

    <footer class="foot">&copy; justryuz &middot; admin</footer>
  </div>

  <script src="data.js"></script>
  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
